<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind AI | المحفظة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0b0e11; --surface: #1e2329; --neon: #00e5ff; --text-gray: #848e9c; --border: #2b3139; --up: #0ecb81; --down: #f6465d; }
        body { background: var(--bg); color: #fff; font-family: 'Tajawal', sans-serif; margin: 0; padding-bottom: 75px; }
        .wallet-card { background: linear-gradient(135deg, #1e2329, #0b0e11); margin: 20px; padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
        .w-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px; }
        .w-btn { background: var(--surface); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border); font-size: 12px; }
        .connect-box { margin: 25px 20px; padding: 20px; border: 1px dashed var(--neon); border-radius: 12px; text-align: center; background: rgba(0,229,255,0.05); }
        .asset-list { margin-top: 20px; }
        .asset-row { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--bg); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--text-gray); text-decoration: none; }
    </style>
</head>
<body>
    <div style="padding:20px;"><h2>المحفظة</h2></div>
    <div class="wallet-card">
        <small style="color:var(--text-gray)">إجمالي الرصيد المقدر</small>
        <div style="font-size:28px; font-weight:bold; margin:10px 0;">0.00 <small style="color:var(--neon); font-size:14px;">USDT</small></div>
    </div>
    
    <div class="w-actions">
        <div class="w-btn"><i class="fas fa-arrow-down" style="color:var(--up)"></i><br>إيداع</div>
        <div class="w-btn"><i class="fas fa-arrow-up" style="color:var(--down)"></i><br>سحب</div>
        <div class="w-btn"><i class="fas fa-exchange-alt"></i><br>تحويل</div>
    </div>

    <div class="connect-box">
        <i class="fas fa-link" style="color:var(--neon); font-size:24px;"></i>
        <p style="font-size:12px; margin:10px 0;">أو اربط محفظتك الخارجية (Web3)</p>
        <button style="background:var(--neon); border:none; padding:10px 20px; border-radius:20px; font-weight:bold;">ربط المحفظة</button>
    </div>

    <div class="asset-list">
        <div class="asset-row"><span>BTC</span><b>0.000000</b></div>
        <div class="asset-row"><span>ETH</span><b>0.000000</b></div>
        <div class="asset-row"><span>USDT</span><b>0.00</b></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="markets.html" class="nav-item"><i class="fas fa-chart-line"></i><span>الأسواق</span></a>
        <a href="trade.html" class="nav-item"><i class="fas fa-exchange-alt"></i><span>تداول</span></a>
        <a href="futures.html" class="nav-item"><i class="fas fa-bolt"></i><span>العقود</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>المحفظة</span></a>
    </nav>
</body>
</html>
