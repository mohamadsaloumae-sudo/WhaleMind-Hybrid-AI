<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind AI | العقود</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0b0e11; --surface: #1e2329; --neon: #00e5ff; --text-gray: #848e9c; --border: #2b3139; --up: #0ecb81; --down: #f6465d; }
        body { background: var(--bg); color: #fff; font-family: 'Tajawal', sans-serif; margin: 0; padding-bottom: 75px; }
        .header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .f-options { display: flex; gap: 10px; padding: 10px 15px; }
        .f-badge { background: var(--surface); padding: 4px 10px; border-radius: 4px; font-size: 11px; color: #fff; }
        
        .f-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px; padding: 15px; }
        .f-btn { width: 100%; padding: 12px; border-radius: 4px; border: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .long { background: var(--up); color: #000; }
        .short { background: var(--down); color: #fff; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--bg); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--text-gray); text-decoration: none; }
    </style>
</head>
<body>
    <div class="header"><b>BTCUSDT العقود الآجلة</b><i class="fas fa-calculator"></i></div>
    <div class="f-options">
        <div class="f-badge">متقاطع (Cross)</div>
        <div class="f-badge">20x</div>
    </div>

    <div class="f-grid">
        <div>
            <button class="f-btn long">شراء / صعود (Long)</button>
            <button class="f-btn short">بيع / هبوط (Short)</button>
            <div style="background:var(--surface); padding:10px; border-radius:4px; font-size:12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>متاح:</span><span>0.00 USDT</span></div>
                <div style="display:flex; justify-content:space-between;"><span>التكلفة:</span><span>0.00 USDT</span></div>
            </div>
        </div>
        <div style="font-size:11px;">
            <div style="color:var(--down)">64540.5<br>64538.2<br>64535.0</div>
            <div style="font-size:16px; font-weight:bold; color:var(--up); margin:10px 0;">64520.10</div>
            <div style="color:var(--up)">64519.0<br>64517.5<br>64515.2</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="markets.html" class="nav-item"><i class="fas fa-chart-line"></i><span>الأسواق</span></a>
        <a href="trade.html" class="nav-item"><i class="fas fa-exchange-alt"></i><span>تداول</span></a>
        <a href="futures.html" class="nav-item active"><i class="fas fa-bolt"></i><span>العقود</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>المحفظة</span></a>
    </nav>
</body>
</html>
