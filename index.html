<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind AI | Terminal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-master: #0b0e11;
            --surface-card: #1e2329;
            --neon-blue: #00d2ff;
            --binance-gray: #848e9c;
            --up: #0ecb81;
            --down: #f6465d;
            --border-alpha: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-master); color: #fff; overflow: hidden; height: 100vh; }

        /* 1. نظام الطبقة المنزلقة (The Depth Drawer) */
        .depth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; display: none; backdrop-filter: blur(4px); }
        .side-profile { position: fixed; top: 0; right: -100%; width: 82%; height: 100%; background: var(--bg-master); z-index: 3500; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-left: 1px solid var(--neon-blue); padding: 40px 20px; }
        .side-profile.active { right: 0; }

        /* 2. الهيدر الثابت (Top Control) */
        header { position: sticky; top: 0; z-index: 1000; background: var(--bg-master); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-alpha); }
        .user-gate { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--neon-blue); display: flex; align-items: center; justify-content: center; color: var(--neon-blue); cursor: pointer; }
        .search-engine { flex: 1; background: var(--surface-card); margin: 0 12px; padding: 10px 15px; border-radius: 20px; font-size: 12px; color: var(--binance-gray); display: flex; align-items: center; gap: 8px; }

        /* 3. حاوية المحتوى (Infinite Viewport) */
        .app-viewport { height: calc(100vh - 135px); overflow-y: auto; scroll-behavior: smooth; }

        /* 4. كروت الإعلانات والبيانات (Binance Style Cards) */
        .promo-area { display: flex; overflow-x: auto; padding: 15px; gap: 12px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .promo-card { min-width: 90%; height: 150px; border-radius: 16px; background: linear-gradient(135deg, #1e2329, #00d2ff11); border: 1px solid var(--border-alpha); scroll-snap-align: center; padding: 20px; position: relative; }

        /* 5. شبكة الخدمات المتقدمة */
        .services-hub { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 16px; border-bottom: 8px solid #000; }
        .hub-item { text-align: center; color: var(--binance-gray); }
        .hub-item i { font-size: 22px; color: var(--neon-blue); margin-bottom: 8px; filter: drop-shadow(0 0 5px var(--neon-blue)); }
        .hub-item span { font-size: 11px; display: block; font-weight: 600; color: #fff; }

        /* 6. التبويبات المثبتة (Sticky System Tabs) */
        .sticky-tabs { position: sticky; top: 0; z-index: 900; background: var(--bg-master); display: flex; gap: 20px; padding: 0 16px; border-bottom: 1px solid var(--border-alpha); overflow-x: auto; scrollbar-width: none; }
        .tab-trigger { padding: 16px 0; font-size: 14px; font-weight: 900; color: var(--binance-gray); white-space: nowrap; border-bottom: 2px solid transparent; }
        .tab-trigger.active { color: var(--neon-blue); border-bottom-color: var(--neon-blue); }

        /* 7. قائمة العملات الاحترافية */
        .market-list { padding: 10px 16px; }
        .market-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border-alpha); }
        .coin-meta { display: flex; align-items: center; gap: 12px; }
        .coin-icon { width: 32px; height: 32px; border-radius: 50%; }
        .price-data { text-align: left; flex: 1; padding-left: 20px; }
        .price-val { font-size: 16px; font-weight: 900; }
        .change-badge { width: 80px; height: 35px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 900; background: rgba(14,203,129,0.15); color: var(--up); }

        /* 8. الفوتر خماسي الأبعاد (Universal Footer) */
        .master-footer { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--bg-master); border-top: 1px solid var(--border-alpha); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 2000; }
        .nav-node { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--binance-gray); text-decoration: none; font-size: 10px; font-weight: bold; }
        .nav-node.active { color: #fff; }
        .nav-node i { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="depth-overlay" id="overlay" onclick="toggleProfile()"></div>
    <div class="side-profile" id="sideProfile">
        <h2 style="color:var(--neon-blue); margin-bottom:30px;">WhaleMind AI</h2>
        <div style="display:flex; flex-direction:column; gap:25px;">
            <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--surface-card); padding-bottom:15px;">إعدادات الحساب <i class="fas fa-cog"></i></div>
            <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--surface-card); padding-bottom:15px;">مركز الدفع <i class="fas fa-credit-card"></i></div>
            <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--surface-card); padding-bottom:15px;">الأمان <i class="fas fa-shield-alt"></i></div>
        </div>
    </div>

    <header>
        <div class="user-gate" onclick="toggleProfile()"><i class="fas fa-user"></i></div>
        <div class="search-engine"><i class="fas fa-search"></i> ابحث عن الحيتان...</div>
        <div style="display:flex; gap:15px; color:var(--binance-gray);"><i class="fas fa-qrcode"></i><i class="fas fa-bell"></i></div>
    </header>

    <div class="app-viewport">
        <div class="promo-area">
            <div class="promo-card">
                <h3 style="color:var(--neon-blue)">WhaleMind Pro</h3>
                <p style="font-size:12px; color:var(--binance-gray); margin-top:5px;">رادار الحيتان متاح الآن بنسخة Alpha v2.0</p>
            </div>
        </div>

        <section class="services-hub">
            <div class="hub-item"><i class="fas fa-robot"></i><span>بوت آلي</span></div>
            <div class="hub-item"><i class="fas fa-satellite-dish"></i><span>الرادار</span></div>
            <div class="hub-item"><i class="fas fa-brain"></i><span>الألفا</span></div>
            <div class="hub-item"><i class="fas fa-ellipsis-h"></i><span>المزيد</span></div>
        </section>

        <nav class="sticky-tabs">
            <div class="tab-trigger active">المفضلة</div>
            <div class="tab-trigger">الرائجة</div>
            <div class="tab-trigger">جديدة</div>
            <div class="tab-trigger">حجم 24س</div>
        </nav>

        <main class="market-list">
            <div class="market-row">
                <div class="coin-meta">
                    <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" class="coin-icon">
                    <div><div style="font-weight:900;">BTC <span style="font-size:10px; color:var(--binance-gray)">/ USDT</span></div><div style="font-size:11px; color:var(--binance-gray)">Vol 45.2B</div></div>
                </div>
                <div class="price-data"><div class="price-val">64,520.10</div><div style="font-size:10px; color:var(--binance-gray)">$64,520.10</div></div>
                <div class="change-badge">+2.45%</div>
            </div>
        </div>
    </main>

    <nav class="master-footer">
        <a href="index.html" class="nav-node active"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="markets.html" class="nav-node"><i class="fas fa-chart-line"></i><span>الأسواق</span></a>
        <a href="trade.html" class="nav-node"><i class="fas fa-exchange-alt"></i><span>تداول</span></a>
        <a href="futures.html" class="nav-node"><i class="fas fa-bolt"></i><span>العقود</span></a>
        <a href="wallet.html" class="nav-node"><i class="fas fa-wallet"></i><span>المحفظة</span></a>
    </nav>

    <script>
        function toggleProfile() {
            const side = document.getElementById('sideProfile');
            const overlay = document.getElementById('overlay');
            side.classList.toggle('active');
            overlay.style.display = (overlay.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
