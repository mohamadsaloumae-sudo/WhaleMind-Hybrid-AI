<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaleMind Hybrid AI | Global Terminal</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #020609;
            --neon-blue: #00d2ff;
            --sidebar-bg: #050a0f;
            --card-bg: #0a1017;
            --text-gray: #848e9c;
            --neon-green: #0ecb81;
            --neon-red: #f6465d;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* القائمة الجانبية الاحترافية */
        .sidebar {
            width: 70px;
            background: var(--sidebar-bg);
            border-right: 1px solid #1e2329;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 0;
            gap: 35px;
        }

        .sidebar i {
            font-size: 22px;
            color: var(--text-gray);
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar i:hover, .sidebar i.active {
            color: var(--neon-blue);
            filter: drop-shadow(0 0 8px var(--neon-blue));
        }

        /* المحتوى الرئيسي */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 60px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid #1e2329;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 2px;
            color: #fff;
        }

        .logo span { color: var(--neon-blue); }

        .system-status {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 12px;
            color: var(--text-gray);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            display: inline-block;
            margin-right: 5px;
        }

        /* تقسيم لوحة التحكم */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 380px;
            flex: 1;
            background: #141a21;
            gap: 1px;
        }

        .chart-section {
            background: var(--bg-deep);
            position: relative;
            padding: 10px;
        }

        #tv_chart {
            width: 100%;
            height: 100%;
        }

        /* لوحة الذكاء الاصطناعي الهجين */
        .ai-panel {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(5, 10, 15, 0.85);
            border: 1px solid var(--neon-blue);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            z-index: 10;
            min-width: 220px;
        }

        .ai-title {
            font-size: 11px;
            color: var(--neon-blue);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ai-value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        /* رادار الحيتان */
        .whale-radar {
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1e2329;
        }

        .radar-header {
            padding: 20px;
            background: rgba(0, 210, 255, 0.05);
            border-bottom: 1px solid #1e2329;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--neon-blue);
        }

        .radar-logs {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.8;
        }

        .log-line { margin-bottom: 12px; color: var(--text-gray); border-bottom: 1px solid #141a21; padding-bottom: 5px; }
        .log-line b { color: var(--neon-blue); }
        .log-line i { color: var(--neon-green); }

        .btn-tg {
            margin: 20px;
            padding: 15px;
            background: var(--neon-blue);
            color: #000;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-tg:hover { background: #fff; box-shadow: 0 0 15px var(--neon-blue); }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-icon"><i class="fas fa-biohazard" style="color: var(--neon-blue);"></i></div>
        <i class="fas fa-chart-area active"></i>
        <i class="fas fa-satellite-dish"></i>
        <i class="fas fa-brain"></i>
        <i class="fas fa-shield-halved"></i>
        <div style="margin-top: auto;"><i class="fas fa-user-gear"></i></div>
    </div>

    <div class="main-wrapper">
        <header>
            <div class="logo">WHALEMIND <span>HYBRID AI</span></div>
            <div class="system-status">
                <span><i class="fas fa-microchip"></i> ENGINE: HYBRID_v1</span>
                <span><span class="live-dot"></span> RADAR ACTIVE</span>
            </div>
        </header>

        <div class="dashboard">
            <div class="chart-section">
                <div class="ai-panel">
                    <div class="ai-title">Hybrid Analysis Prob.</div>
                    <div class="ai-value">94.8% <span style="font-size: 14px; color: var(--neon-green);">BULLISH</span></div>
                    <div style="font-size: 10px; margin-top: 8px; color: var(--text-gray);">Detecting Institutional Entry...</div>
                </div>
                <div id="tv_chart"></div>
            </div>

            <div class="whale-radar">
                <div class="radar-header">
                    <i class="fas fa-crosshairs"></i> LIVE WHALE RADAR
                </div>
                <div class="radar-logs" id="logs">
                    <div class="log-line"><i>[READY]</i> System initialized...</div>
                    <div class="log-line"><b>[SCAN]</b> Monitoring transactions > $5M...</div>
                </div>
                <a href="https://t.me/WhaleMindAI" class="btn-tg">JOIN PRIVATE CHANNEL</a>
            </div>
        </div>
    </div>

    <script>
        // 1. تشغيل الرسوم البيانية (Neon Style)
        const chart = LightweightCharts.createChart(document.getElementById('tv_chart'), {
            layout: { backgroundColor: '#020609', textColor: '#848e9c' },
            grid: { vertLines: { color: '#0a1017' }, horzLines: { color: '#0a1017' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#1e2329' },
            timeScale: { borderColor: '#1e2329' },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#0ecb81', downColor: '#f6465d', borderVisible: false,
            wickUpColor: '#0ecb81', wickDownColor: '#f6465d',
        });

        // بيانات وهمية للعرض فقط - سيتم ربطها لاحقاً بالبيانات الحقيقية
        candleSeries.setData([
            { time: '2026-04-20', open: 64000, high: 65500, low: 63800, close: 65000 },
            { time: '2026-04-21', open: 65000, high: 66800, low: 64500, close: 66200 },
            { time: '2026-04-22', open: 66200, high: 66500, low: 65200, close: 65800 },
            { time: '2026-04-23', open: 65800, high: 68000, low: 65700, close: 67400 },
            { time: '2026-04-24', open: 67400, high: 70200, low: 67200, close: 69500 },
            { time: '2026-04-25', open: 69500, high: 72000, low: 69300, close: 71200 },
        ]);

        // 2. محاكاة رادار الحيتان (الميكانيكا الحية)
        const logsContainer = document.getElementById('logs');
        const whaleMessages = [
            "<b>[ALERT]</b> $12.4M BTC moved from Unknown to Binance",
            "<i>[ANALYSIS]</i> High Volatility expected in 5 mins",
            "<b>[DETECTION]</b> Whale #7721 accumulating ETH",
            "<b>[ALERT]</b> $8.9M USDT inflow detected",
            "<i>[HYBRID AI]</i> Trend strength confirms 94% success",
            "<b>[ALERT]</b> Institutional Buy Order: 450 BTC"
        ];

        let index = 0;
        setInterval(() => {
            const newLog = document.createElement('div');
            newLog.className = 'log-line';
            newLog.innerHTML = whaleMessages[index % whaleMessages.length];
            logsContainer.prepend(newLog);
            index++;
        }, 4000); // يضيف رسالة جديدة كل 4 ثوانٍ
    </script>
</body>
</html>
