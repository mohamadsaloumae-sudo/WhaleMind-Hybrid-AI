<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>WhaleMind AI | لوحة التحكم</title>
    <style>
        .pulse-dot { height: 12px; width: 12px; background-color: #2ecc71; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #2ecc71; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 10px; background: #fff; text-align: center; }
    </style>
</head>
<body style="font-family: Arial; background: #f4f7f9;">
    <div class="card">
        <h2>إمبراطورية WhaleMind AI 🐋</h2>
        <p><span class="pulse-dot"></span> الحالة: <strong id="status">الروبوت يراقب السوق...</strong></p>
        <hr>
        <div id="gas-info">رصيد الغاز: <strong>50.00$</strong></div>
        <div id="demo-info">الصفقات التجريبية: <strong>0 / 10</strong></div>
        <br>
        <button onclick="connectWallet()" style="background: #1a2a6c; color: white; padding: 10px 20px; border: none; border-radius: 5px;">ربط محفظة (Web3)</button>
        <button onclick="startBot()" style="background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 5px;">تفعيل التداول الآلي</button>
    </div>

    <script>
        function startBot() {
            alert("بدأت عملية التداول السحابي.. يمكنك إغلاق هاتفك الآن!");
            document.getElementById('status').innerText = "جاري صيد الفرص بدقة +95%...";
        }
        async function connectWallet() {
            // هنا سيضع الـ Pro كود ربط MetaMask الفعلي
            alert("جاري الاتصال بمحفظتك لتأمين الغاز...");
        }
    </script>
</body>
</html>
