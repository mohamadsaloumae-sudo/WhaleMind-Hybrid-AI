<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind AI | Binance Deep System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0e11;
            --neon: #00d2ff;
            --surface: #1e2329;
            --text-dim: #848e9c;
            --up: #0ecb81;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; -webkit-overflow-scrolling: touch; }
        body { background: var(--bg-deep); color: #fff; overflow: hidden; height: 100vh; }

        /* الحاوية الرئيسية (نظام الطبقات) */
        .app-shell { height: 100vh; display: flex; flex-direction: column; position: relative; }

        /* الهيدر (طبقة ثابتة 1) */
        header {
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
            z-index: 1000; background: var(--bg-deep);
        }
        .profile-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--neon); display: flex; align-items: center; justify-content: center; color: var(--neon); cursor: pointer; }

        /* منطقة المحتوى القابل للانزلاق (Main Depth) */
        .scrolling-content {
            flex: 1; overflow-y: auto; padding-bottom: 100px; /* سر الانزلاق اللانهائي */
        }

        /* نظام الإعلانات (Elastic Carousel) */
        .ad-flow { display: flex; overflow-x: auto; padding: 15px; gap: 12px; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .ad-flow::-webkit-scrollbar { display: none; }
        .ad-card { min-width: 85%; height: 140px; border-radius: 12px; background: linear-gradient(135deg, #1e2329, #00d2ff22); border: 1px solid rgba(0,210,255,0.1); scroll-snap-align: center; padding: 20px; }

        /* شبكة الخدمات (Quick Actions) */
        .actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px 16px; border-bottom: 8px solid #000; }
        .action-node { text-align: center; font-size: 11px; }
        .action-node i { font-size: 24px; color: var(--neon); margin-bottom: 8px; }

        /* التبويبات المثبتة (Sticky Depth) */
        .tabs-bar {
            position: sticky; top: 0; z-index: 900; background: var(--bg-deep);
            display: flex; gap: 20px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05);
            overflow-x: auto; scrollbar-width: none;
        }
        .tab-item { padding: 15px 0; font-size: 14px; font-weight: 900; color: var(--text-dim); white-space: nowrap; }
        .tab-item.active { color: var(--neon); border-bottom: 2px solid var(--neon); }

        /* قائمة البيانات الحقيقية */
        .market-list { padding: 8px 16px; }
        .market-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .coin-box { display: flex; align-items: center; gap: 12px; }
        .coin-icon { width: 30px; height: 30px; border-radius: 50%; }

        /* القائمة الجانبية (العمق المخبأ) */
        .side-depth {
            position: fixed; top: 0; right: -100%; width: 85%; height: 100%;
            background: var(--bg-deep); z-index: 2000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid var(--neon); padding: 50px 20px;
        }
        .side-depth.active { right: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1500; display: none; }

        /* الفوتر (الثبات المطلق) */
        .nav-footer {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background: var(--bg-deep); border-top: 1px solid rgba(255,255,255,0.05);
            display: grid; grid-template-columns: repeat(5, 1fr); z-index: 1000;
        }
        .nav-node { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--text-dim); text-decoration: none; }
        .nav-node.active { color: #fff; }
        .nav-node i { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
        <div class="side-depth" id="sideMenu">
            <h2 style="color:var(--neon); margin-bottom:40px;">الرادار الشخصي</h2>
            <div style="display:flex; flex-direction:column; gap:25px;">
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #1e2329; padding-bottom:15px;">إعدادات الحساب <i class="fas fa-cog"></i></div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #1e2329; padding-bottom:15px;">مركز الدفع <i class="fas fa-credit-card"></i></div>
            </div>
        </div>

        <header>
            <div class="profile-btn" onclick="toggleMenu()"><i class="fas fa-user"></i></div>
            <div style="flex:1; margin:0 12px; background:var(--surface); padding:8px 15px; border-radius:20px; font-size:12px; color:var(--text-dim);"><i class="fas fa-search"></i> ابحث عن الحيتان...</div>
            <i class="fas fa-bell" style="color:var(--text-dim); font-size:20px;"></i>
        </header>

        <div class="scrolling-content">
            <div class="ad-flow">
                <div class="ad-card"><h3>WhaleMind AI</h3><p style="font-size:12px; color:var(--text-dim)">رادار السيولة v2.0</p></div>
                <div class="ad-card" style="border-color:var(--up)"><h3>Alpha Premium</h3><p style="font-size:12px; color:var(--text-dim)">انضم للقناة المدفوعة الآن</p></div>
            </div>

            <section class="actions-grid">
                <div class="action-node"><i class="fas fa-robot"></i><span>بوت آلي</span></div>
                <div class="action-node"><i class="fas fa-satellite-dish"></i><span>الرادار</span></div>
                <div class="action-node"><i class="fas fa-bolt"></i><span>العقود</span></div>
                <div class="action-node"><i class="fas fa-ellipsis-h"></i><span>المزيد</span></div>
            </section>

            <nav class="tabs-bar">
                <div class="tab-item active">المفضلة</div>
                <div class="tab-item">الرائجة</div>
                <div class="tab-item">جديدة</div>
                <div class="tab-item">حجم 24س</div>
            </nav>

            <main class="market-list">
                <div class="market-row">
                    <div class="coin-box">
                        <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" class="coin-icon">
                        <div><div style="font-weight:900;">BTC <span style="font-size:10px; color:var(--text-dim)">/ USDT</span></div><div style="font-size:11px; color:var(--text-dim)">Vol 45.2B</div></div>
                    </div>
                    <div style="text-align:left; flex:1; padding-left:25px;"><div style="font-weight:900; font-size:16px;">64,520.10</div><div style="font-size:10px; color:var(--text-dim)">$64,520.10</div></div>
                    <div style="width:75px; height:32px; border-radius:4px; background:rgba(14,203,129,0.15); color:var(--up); display:flex; align-items:center; justify-content:center; font-weight:900;">+2.45%</div>
                </div>
            </main>
        </div>

        <nav class="nav-footer">
            <a href="index.html" class="nav-node active"><i class="fas fa-home"></i><span>الرئيسية</span></a>
            <a href="markets.html" class="nav-node"><i class="fas fa-chart-line"></i><span>الأسواق</span></a>
            <a href="pro_trade.html" class="nav-node"><i class="fas fa-exchange-alt"></i><span>تداول</span></a>
            <a href="futures.html" class="nav-node"><i class="fas fa-bolt"></i><span>العقود</span></a>
            <a href="wallet.html" class="nav-node"><i class="fas fa-wallet"></i><span>المحفظة</span></a>
        </nav>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            menu.classList.toggle('active');
            overlay.style.display = (overlay.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
