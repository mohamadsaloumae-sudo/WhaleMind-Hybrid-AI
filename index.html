<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind Hybrid Terminal</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #fcd535; --bg: #0b0e11; --panel: #181a20; --border: #2b3139; --neon: #00d2ff; }
        
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }

        /* حاوية النظام المتجاوبة */
        .app-container { display: flex; flex-direction: column; height: 100vh; }

        /* الهيدر العلوي */
        header { height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; }
        .logo { font-weight: bold; font-size: 18px; color: var(--neon); font-family: sans-serif; }

        /* منطقة المحتوى الرئيسية */
        .main-content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }

        /* نظام الكروت المتجاوب (Grid) */
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        /* إذا كانت الشاشة كبيرة (كمبيوتر/ايباد) تتوزع الكروت بجانب بعضها */
        @media (min-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr 1fr; }
            .chart-section { grid-column: span 2; }
        }

        /* كروت الربط (مركزي ولا مركزي) */
        .connect-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; transition: 0.3s; }
        .connect-card:hover { border-color: var(--neon); }
        .card-title { font-size: 14px; color: #848e9c; margin-bottom: 10px; }
        
        .btn-connect { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-cex { background: var(--accent); color: #000; }
        .btn-dex { background: #3b82f6; color: #fff; }

        /* محرك التداول */
        #tv_chart_container { height: 400px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }

        /* البار السفلي الاستاندرد */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--panel); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #848e9c; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }

    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">WhaleMind <span style="color:#fff">AI</span></div>
        <div style="font-size: 12px;"><i class="fas fa-circle" style="color:#0ecb81; font-size: 8px;"></i> نظام هجين متصل</div>
    </header>

    <div class="main-content">
        <div class="dashboard-grid">
            <div class="connect-card">
                <div class="card-title"><i class="fas fa-building"></i> تداول مركزي (CEX)</div>
                <div style="font-size: 12px;">اربط حساب Binance عبر API</div>
                <button class="btn-connect btn-cex">ربط المنصة</button>
            </div>

            <div class="connect-card">
                <div class="card-title"><i class="fas fa-wallet"></i> تداول لا مركزي (DEX)</div>
                <div style="font-size: 12px;">اربط محفظة MetaMask / Trust</div>
                <button class="btn-connect btn-dex">ربط المحفظة</button>
            </div>

            <div class="chart-section" id="tv_chart_container"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-home"></i>الرئيسية</div>
        <div class="nav-item"><i class="fas fa-chart-line"></i>الأسواق</div>
        <div class="nav-item"><i class="fas fa-exchange-alt"></i>تداول</div>
        <div class="nav-item"><i class="fas fa-bolt"></i>عقود</div>
        <div class="nav-item"><i class="fas fa-wallet"></i>المحفظة</div>
    </nav>
</div>

<script>
    // تشغيل المحرك العالمي مع إعدادات التجاوب
    new TradingView.widget({
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "container_id": "tv_chart_container"
    });
</script>

</body>
</html>
