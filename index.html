<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0b0e11; --surface: #1e2329; --neon: #00e5ff; --up: #0ecb81; --down: #f6465d; }
        body { background: var(--bg); color: #fff; font-family: 'Tajawal', sans-serif; margin: 0; }
        .market-nav { display: flex; gap: 30px; padding: 20px 5%; border-bottom: 1px solid #2b3139; }
        .tab-btn { background: none; border: none; color: #848e9c; cursor: pointer; font-size: 16px; padding-bottom: 10px; }
        .tab-btn.active { color: var(--neon); border-bottom: 2px solid var(--neon); }
        .market-table { width: 90%; margin: 20px auto; border-collapse: collapse; }
        th { text-align: right; color: #848e9c; font-size: 14px; padding: 15px; }
        td { padding: 15px; border-bottom: 1px solid #2b3139; }
        .coin-icon { width: 24px; vertical-align: middle; margin-left: 10px; }
        .btn-trade-small { background: var(--surface); color: var(--neon); border: 1px solid var(--neon); padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="market-nav">
        <button class="tab-btn active">كل العملات</button>
        <button class="tab-btn">المفضلات</button>
        <button class="tab-btn">رصد الحيتان (AI)</button>
    </div>
    <table class="market-table">
        <thead><tr><th>الاسم</th><th>السعر</th><th>تغيير 24س</th><th>حجم التداول</th><th>الإجراء</th></tr></thead>
        <tbody>
            <tr>
                <td><img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" class="coin-icon">BTC <span style="color:#848e9c">Bitcoin</span></td>
                <td>64,125.50</td>
                <td style="color:var(--up)">+2.45%</td>
                <td>$35.2B</td>
                <td><button class="btn-trade-small" onclick="location.href='2-trade.html'">تداول</button></td>
            </tr>
            </tbody>
    </table>
</body>
</html>
