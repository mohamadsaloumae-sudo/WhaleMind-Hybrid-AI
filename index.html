<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind | المحفظة المركزية واللامركزية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0b0e11; --surface: #1e2329; --neon: #00e5ff; --text-gray: #848e9c; --border: #2b3139; --up: #0ecb81; --down: #f6465d; }
        body { background: var(--bg); color: #fff; font-family: 'Tajawal', sans-serif; margin: 0; padding-bottom: 80px; overflow-x: hidden; }

        /* كرت الرصيد الرئيسي */
        .balance-card {
            background: linear-gradient(135deg, #1e2329 0%, #0b0e11 100%);
            margin: 20px; padding: 25px; border-radius: 15px;
            border: 1px solid var(--border); position: relative; overflow: hidden;
        }
        .balance-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0,229,255,0.05) 0%, transparent 70%);
        }

        /* أزرار العمليات الكبيرة */
        .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 0 20px; }
        .action-btn {
            background: var(--surface); border: 1px solid var(--border); color: #fff;
            padding: 15px 5px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .action-btn:active { transform: scale(0.95); background: #2b3139; }
        .action-btn i { font-size: 20px; color: var(--neon); margin-bottom: 8px; display: block; }

        /* قسم ربط المحفظة اللامركزية (Web3) */
        .connect-wallet-section {
            margin: 25px 20px; padding: 20px; border-radius: 12px;
            background: rgba(0, 229, 255, 0.05); border: 1px dashed var(--neon);
            text-align: center;
        }
        .connect-btn {
            background: var(--neon); color: #000; border: none; padding: 12px 25px;
            border-radius: 25px; font-weight: 900; margin-top: 15px; cursor: pointer;
        }

        /* قائمة الأصول (Assets) */
        .assets-section { margin-top: 30px; }
        .asset-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .asset-icon { width: 35px; height: 35px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: 12px; }

        /* شريط سفلي ثابت */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--bg); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--text-gray); text-decoration: none; }
        .nav-item.active { color: var(--neon); }
    </style>
</head>
<body>

    <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin:0; font-size: 20px;">المحفظة</h2>
        <i class="fas fa-history" style="color: var(--text-gray);"></i>
    </div>

    <div class="balance-card">
        <small style="color: var(--text-gray);">إجمالي الرصيد المقدر (USDT)</small>
        <div style="font-size: 32px; font-weight: 900; margin: 10px 0;">0.00 <span style="font-size: 16px; color: var(--neon);">USDT</span></div>
        <div style="color: var(--text-gray); font-size: 14px;">≈ 0.00 BTC</div>
    </div>

    <div class="action-grid">
        <div class="action-btn"><i class="fas fa-arrow-down"></i><span>إيداع</span></div>
        <div class="action-btn"><i class="fas fa-arrow-up"></i><span>سحب</span></div>
        <div class="action-btn"><i class="fas fa-sync-alt"></i><span>تحويل</span></div>
    </div>

    <div class="connect-wallet-section">
        <i class="fas fa-link" style="font-size: 24px; color: var(--neon);"></i>
        <h4 style="margin: 10px 0;">ربط محفظة Web3</h4>
        <p style="font-size: 12px; color: var(--text-gray); margin: 0;">هل تفضل التداول من محفظتك الخاصة؟ اربط Trust Wallet أو MetaMask الآن.</p>
        <button class="connect-btn" onclick="connectWallet()">ربط المحفظة الخارجية</button>
    </div>

    <div class="assets-section">
        <div style="padding: 0 20px 10px; font-weight: bold; border-bottom: 1px solid var(--border);">الأصول المملوكة</div>
        
        <div class="asset-row">
            <div style="display: flex; align-items: center;">
                <div class="asset-icon"><i class="fab fa-ethereum" style="color:#627EEA"></i></div>
                <div><b>ETH</b><br><small style="color:var(--text-gray)">Ethereum</small></div>
            </div>
            <div style="text-align: left;"><b>0.00</b><br><small style="color:var(--text-gray)">$0.00</small></div>
        </div>

        <div class="asset-row">
            <div style="display: flex; align-items: center;">
                <div class="asset-icon"><i class="fas fa-dollar-sign" style="color:var(--up)"></i></div>
                <div><b>USDT</b><br><small style="color:var(--text-gray)">Tether</small></div>
            </div>
            <div style="text-align: left;"><b>0.00</b><br><small style="color:var(--text-gray)">$0.00</small></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="markets.html" class="nav-item"><i class="fas fa-chart-line"></i><span>الأسواق</span></a>
        <a href="trade.html" class="nav-item"><i class="fas fa-exchange-alt"></i><span>تداول</span></a>
        <a href="community.html" class="nav-item"><i class="fas fa-users"></i><span>المجتمع</span></a>
        <a href="wallet.html" class="nav-item active"><i class="fas fa-wallet"></i><span>المحفظة</span></a>
    </nav>

    <script>
        function connectWallet() {
            alert("جاري الاتصال بـ MetaMask... (هنا نربط مكتبة Web3.js)");
            // مستقبلاً سنضع كود الربط الحقيقي هنا
        }
    </script>

</body>
</html>
