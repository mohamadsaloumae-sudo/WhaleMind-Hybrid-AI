<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaleMind AI | مركز السيطرة</title>
    <style>
        :root {
            --bg-black: #050505;
            --neon-blue: #00d2ff;
            --neon-green: #00ff41;
            --neon-red: #ff0055;
            --dark-gray: #1a1a1a;
        }

        body {
            background-color: var(--bg-black);
            color: var(--neon-blue);
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* رأس الصفحة */
        .header {
            padding: 15px 25px;
            border-bottom: 2px solid var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 210, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* منطقة الرادار */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            padding: 20px;
            flex-grow: 1;
            overflow: hidden;
        }

        .radar-panel {
            border: 1px solid var(--neon-blue);
            background: rgba(0, 210, 255, 0.02);
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .alert-card {
            background: rgba(255, 0, 85, 0.1);
            border-right: 4px solid var(--neon-red);
            margin-bottom: 15px;
            padding: 15px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .whale-value { color: var(--neon-red); font-weight: bold; font-size: 1.2em; }

        /* سجل النظام الصغير */
        .logs-panel {
            border: 1px solid var(--dark-gray);
            background: #000;
            padding: 15px;
            font-size: 0.85em;
            color: #888;
            overflow-y: auto;
        }

        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #111; padding-bottom: 2px; }
        .log-time { color: var(--neon-blue); margin-left: 10px; }

        /* شريط التنبيه السفلي */
        .footer-ticker {
            height: 30px;
            background: var(--neon-blue);
            color: #000;
            display: flex;
            align-items: center;
            font-weight: bold;
            padding: 0 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 1.5em; font-weight: bold; letter-spacing: 2px;">WHALEMIND <span style="color:#fff">AI</span></div>
        <div>
            <span class="status-dot"></span>
            <span id="sys-text">النظام متصل: TITANIUM V60</span>
        </div>
    </div>

    <div class="main-container">
        <div class="radar-panel" id="radar-screen">
            <h2 style="margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px;">📡 رادار الحيتان المباشر</h2>
            <div id="alerts-container">
                <div style="text-align: center; margin-top: 50px; color: #444;">بانتظار وصول نبضات التيتانيوم من السيرفر...</div>
            </div>
        </div>

        <div class="logs-panel" id="log-screen">
            <div class="log-entry"><span class="log-time">[00:00:01]</span> تشغيل المحرك الأساسي...</div>
            <div class="log-entry"><span class="log-time">[00:00:02]</span> جاري فحص سيولة Binance...</div>
        </div>
    </div>

    <div class="footer-ticker">
        أحدث حركة: <span id="ticker-move">جاري المسح...</span>
    </div>

    <script>
        // وظيفة تحديث الواجهة (الجسر)
        async function fetchWhaleData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (data.status === "ONLINE") {
                    const container = document.getElementById('alerts-container');
                    
                    if (data.whale_radar && data.whale_radar.length > 0) {
                        // مسح رسالة "بانتظار" إذا وجدت بيانات
                        if (container.innerText.includes("بانتظار")) container.innerHTML = '';

                        data.whale_radar.forEach(whale => {
                            const id = `w-${whale.pair}-${whale.amount}`.replace(/[^a-zA-Z0-9]/g, '');
                            if (!document.getElementById(id)) {
                                const card = document.createElement('div');
                                card.id = id;
                                card.className = 'alert-card';
                                card.innerHTML = `
                                    <div style="display:flex; justify-content:space-between;">
                                        <span>💎 رصد عملة: <b>${whale.pair}</b></span>
                                        <span class="whale-value">${whale.amount}</span>
                                    </div>
                                    <div style="font-size: 0.8em; margin-top:5px; color:#aaa;">
                                        النوع: ${whale.type} | الوقت: ${new Date().toLocaleTimeString()}
                                    </div>
                                `;
                                container.prepend(card);
                                
                                // تحديث الشريط السفلي
                                document.getElementById('ticker-move').innerText = `${whale.pair} - ${whale.amount}`;
                                
                                // إضافة للسجل
                                addLog(`تم رصد حركة حوت على ${whale.pair}`);
                            }
                        });
                    }
                }
            } catch (err) {
                console.log("Waiting for Server...");
            }
        }

        function addLog(msg) {
            const logs = document.getElementById('log-screen');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            logs.prepend(entry);
        }

        // تشغيل التحديث كل 3 ثوانٍ
        setInterval(fetchWhaleData, 3000);
        fetchWhaleData();
    </script>
</body>
</html>
