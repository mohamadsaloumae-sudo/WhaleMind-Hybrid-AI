<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>WhaleMind AI | بوابة الدخول</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f7f9; text-align: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .hidden { display: none; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; color: white; font-weight: bold; }
        .btn-radar { background: #1a2a6c; }
        .btn-recharge { background: #27ae60; }
        
        /* تنسيقات إضافية لبوابة الدفع */
        .payment-box {
            margin-top: 20px; 
            padding: 15px; 
            background: #e8f4fd; 
            border-radius: 8px; 
            border: 1px dashed #3498db;
        }
        .input-field {
            width: 90%; 
            padding: 10px; 
            margin-bottom: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card" id="login-section">
        <h2>إمبراطورية WhaleMind 🐋</h2>
        <p>يرجى تسجيل الدخول للوصول إلى الرادار</p>
        <div id="g_id_onload"
             data-client_id="ضع_مفتاح_جوجل_كلاينت_هنا.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <div class="card hidden" id="dashboard-section">
        <h2>مرحباً، <span id="user-name">شريك النجاح</span> 👑</h2>
        <p>رصيد الغاز: <strong id="gas-balance">0.00$</strong></p>
        <p>الرتبة: <strong id="user-rank">FREE</strong></p>
        <hr>
        
        <button class="btn btn-radar" onclick="triggerAction('RADAR')">📡 تشغيل رادار الحيتان</button>
        <button class="btn btn-recharge" onclick="triggerAction('RECHARGE')">💳 شحن الرصيد (Web3)</button>
        
        <div id="payment-section" class="hidden payment-box">
            <h3 style="color: #2980b9; margin-top: 0;">بوابة الدفع (TRC20)</h3>
            <p style="font-size: 0.9em;">الرجاء إرسال <strong>50 USDT</strong> بالضبط إلى المحفظة التالية:</p>
            
            <input type="text" class="input-field" value="TRSKhB9Fvvw6SM8QpK2vep4XqN6gyXDQ9V" readonly style="font-weight: bold; color: #2c3e50;">
            
            <p style="font-size: 0.9em; margin-bottom: 5px;">بعد التحويل، ضع رقم المعاملة (TXID) للتحقق:</p>
            <input type="text" id="txid-input" class="input-field" placeholder="مثال: a1b2c3d4...">
            
            <button class="btn" style="background: #e67e22; width: 95%;" onclick="verifyPayment()">تأكيد الدفع 🔄</button>
        </div>
        <p id="system-status" style="margin-top: 15px; color: #7f8c8d; font-size: 0.9em;">الروبوت في وضع الاستعداد...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
