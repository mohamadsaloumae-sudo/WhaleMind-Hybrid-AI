<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaleMind Community | مجتمع النخبة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        :root {
            --bg-black: #0b0e11;
            --surface: #1e2329;
            --whale-blue: #00e5ff;
            --border: #2b3139;
            --text-gray: #848e9c;
        }

        body { background: var(--bg-black); color: #fff; font-family: 'Tajawal', sans-serif; margin: 0; }

        /* تقسيم الشاشة: يمين (قوائم)، وسط (خلاصة المنشورات)، يسار (غرف صوتية) */
        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            height: 100vh;
            max-width: 1440px; margin: 0 auto;
        }

        /* الوسط - Feed */
        .feed-section {
            border-right: 1px solid var(--border);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 20px;
        }

        /* صندوق كتابة منشور جديد */
        .post-box {
            background: var(--surface); padding: 15px; border-radius: 8px; margin-bottom: 25px;
        }
        .post-input {
            width: 100%; background: transparent; border: none; color: #fff;
            font-size: 16px; outline: none; resize: none; margin-bottom: 15px;
        }
        .post-actions {
            display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 10px;
        }

        /* المنشورات */
        .post-card {
            background: var(--surface); border-radius: 8px; padding: 15px; margin-bottom: 20px;
            border: 1px solid transparent; transition: 0.3s;
        }
        .post-card:hover { border-color: var(--whale-blue); }
        .user-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--whale-blue); }
        
        .post-image { width: 100%; border-radius: 8px; margin: 15px 0; }

        .interaction-bar { display: flex; gap: 20px; color: var(--text-gray); font-size: 14px; }
        .interaction-bar i:hover { color: var(--whale-blue); cursor: pointer; }

        /* الغرف الصوتية (Audio Spaces) */
        .spaces-section { padding: 20px; }
        .space-card {
            background: linear-gradient(135deg, #002d33, #000);
            border: 1px solid var(--whale-blue);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
        }
        .live-tag {
            background: #f6465d; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 10px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; }
            .spaces-section, .left-menu { display: none; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="left-menu" style="padding:20px;">
            <div style="font-weight:900; color:var(--whale-blue); font-size:24px; margin-bottom:40px;">WHALEMIND</div>
            <nav style="display:flex; flex-direction:column; gap:20px;">
                <a href="#" style="color:var(--whale-blue); text-decoration:none;"><i class="fas fa-home"></i> الخلاصة</a>
                <a href="#" style="color:#fff; text-decoration:none;"><i class="fas fa-chart-line"></i> الإشارات</a>
                <a href="#" style="color:#fff; text-decoration:none;"><i class="fas fa-wallet"></i> المحفظة</a>
                <a href="#" style="color:#fff; text-decoration:none;"><i class="fas fa-user"></i> البروفايل</a>
            </nav>
        </aside>

        <main class="feed-section">
            <div class="post-box">
                <textarea class="post-input" placeholder="ماذا رصد رادارك اليوم؟"></textarea>
                <div class="post-actions">
                    <div style="display:flex; gap:15px; color:var(--whale-blue);">
                        <i class="fas fa-image"></i> <i class="fas fa-chart-bar"></i> <i class="fas fa-link"></i>
                    </div>
                    <button style="background:var(--whale-blue); border:none; padding:5px 20px; border-radius:4px; font-weight:bold;">نشر</button>
                </div>
            </div>

            <div class="post-card">
                <div class="user-meta">
                    <div class="avatar"></div>
                    <div>
                        <div style="font-weight:bold;">حوت_تيتانيوم_60</div>
                        <div style="font-size:12px; color:var(--text-gray);">منذ 5 دقائق</div>
                    </div>
                </div>
                <p>رصدت سيولة ضخمة تدخل على زوج BTC/USDT. استعدوا للانفجار! 🚀</p>
                <img src="https://i.ibb.co/vz6mD2V/whale-ai-logo.png" class="post-image" alt="Chart Analysis">
                <div class="interaction-bar">
                    <span><i class="far fa-heart"></i> 124</span>
                    <span><i class="far fa-comment"></i> 45 تعليق</span>
                    <span><i class="fas fa-share"></i> مشاركة</span>
                </div>
            </div>
        </main>

        <aside class="spaces-section">
            <h3 style="margin-bottom:20px;">غرف صوتية مباشرة</h3>
            
            <div class="space-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="live-tag">مباشر الآن</span>
                    <i class="fas fa-headset" style="color:var(--whale-blue);"></i>
                </div>
                <h4 style="margin:10px 0;">تحليل إغلاق شمعة اليوم</h4>
                <p style="font-size:12px; color:var(--text-gray);">بصوت: المهندس أحمد (محلل تقني)</p>
                <button style="width:100%; background:transparent; border:1px solid var(--whale-blue); color:var(--whale-blue); padding:8px; border-radius:5px; margin-top:10px; cursor:pointer;">انضم للاستماع</button>
            </div>

            <div class="space-card" style="border-color:#333; opacity:0.7;">
                <h4 style="margin:10px 0;">دردشة حول سيكولوجية الحيتان</h4>
                <p style="font-size:12px; color:var(--text-gray);">تبدأ الساعة 9:00 مساءً</p>
                <button style="width:100%; background:#333; border:none; color:#888; padding:8px; border-radius:5px; margin-top:10px;">تذكير</button>
            </div>
        </aside>

    </div>

</body>
</html>
