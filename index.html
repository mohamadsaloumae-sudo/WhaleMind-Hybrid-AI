<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaleMind AI | Titanium v2.3</title>
    <style>
        :root {
            --bg-black: #050505;
            --neon-blue: #00d2ff;
            --neon-gold: #ffc107;
            --neon-green: #00ff41;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: radial-gradient(circle at center, #111, #000);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* الطبقة العلوية الزجاجية */
        .header {
            padding: 15px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        /* الرادار ثلاثي الأبعاد */
        .radar-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            background: repeating-conic-gradient(from 0deg, rgba(0,210,255,0.1) 0deg 30deg, transparent 30deg 60deg);
            box-shadow: 0 0 30px rgba(0,210,255,0.2), inset 0 0 50px rgba(0,210,255,0.1);
            animation: rotateRadar 4s linear infinite;
        }

        @keyframes rotateRadar { 100% { transform: rotate(360deg); } }

        /* منطقة البيانات (بدون تداخل) */
        .main-display {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* بطاقات البيانات الشفافة */
        .whale-card {
            background: var(--glass);
            border: 1px solid rgba(0,210,255,0.2);
            border-right: 5px solid var(--neon-gold);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }

        /* الأزرار الخمسة العالمية */
        .nav-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #000;
            padding: 10px;
            border-top: 1px solid #333;
        }

        .nav-btn {
            background: linear-gradient(145deg, #1a1a1a, #000);
            border: 1px solid #444;
            color: var(--neon-blue);
            padding: 10px 2px;
            border-radius: 5px;
            font-size: 0.7rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:active { transform: scale(0.9); box-shadow: 0 0 10px var(--neon-blue); }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold;">WHALEMIND <span style="color:var(--neon-blue)">AI</span></div>
        <div style="font-size: 0.8rem;"><span style="color:var(--neon-green)">●</span> ACTIVE v2.3</div>
    </div>

    <div class="radar-container" id="radar"></div>

    <div class="main-display" id="data-screen">
        <div style="text-align:center; color:#666; margin-top:20px;">جاري الاتصال بمحرك التيتانيوم...</div>
    </div>

    <div class="nav-bar">
        <div class="nav-btn" onclick="window.location.reload()">🔄 الرادار</div>
        <div class="nav-btn" onclick="alert('تحليل الذكاء الاصطناعي نشط')">🧠 التحليل</div>
        <div class="nav-btn" onclick="window.open('https://t.me/bot_WhaleMindAI')">💎 القناة</div>
        <div class="nav-btn" onclick="alert('نظام الدفع TRC20 مؤمن')">💰 المحفظة</div>
        <div class="nav-btn" onclick="alert('الإعدادات الإدارية')">⚙️ الإدارة</div>
    </div>

    <script>
        // دالة جلب البيانات الحقيقية
        async function updateUI() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                const screen = document.getElementById('data-screen');

                if (data.whale_radar && data.whale_radar.length > 0) {
                    screen.innerHTML = ''; // مسح رسالة التحميل
                    data.whale_radar.forEach(whale => {
                        screen.innerHTML += `
                            <div class="whale-card">
                                <div>
                                    <span style="color:#888; font-size:0.7rem;">[${new Date().toLocaleTimeString()}]</span><br>
                                    <b>${whale.pair}</b>
                                </div>
                                <div style="color:var(--neon-gold); font-weight:bold;">${whale.amount}</div>
                            </div>
                        `;
                    });
                }
            } catch (e) { console.log("Re-syncing..."); }
        }
        setInterval(updateUI, 3000);
    </script>
</body>
</html>
