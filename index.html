<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind | Home</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0b0e11; --surface: #1e2329; --neon: #00e5ff; --up: #0ecb81; --down: #f6465d; --text-gray: #848e9c; --border: #2b3139; }
        body { background: var(--bg); color: #fff; font-family: 'Tajawal', sans-serif; margin: 0; padding-bottom: 80px; }
        .top-header { position: sticky; top: 0; background: var(--bg); z-index: 1000; padding: 12px 15px; display: flex; align-items: center; border-bottom: 1px solid var(--border); justify-content: space-between; }
        .search-bar { background: var(--surface); flex: 1; margin: 0 15px; padding: 8px 15px; border-radius: 20px; color: var(--text-gray); font-size: 12px; }
        
        .tickers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .t-card { background: var(--surface); padding: 12px 8px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .t-card span { display: block; font-size: 11px; margin-bottom: 4px; }
        .t-price { font-weight: bold; font-size: 14px; }

        .services { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 15px; border-bottom: 6px solid #181a20; }
        .s-item { text-align: center; font-size: 10px; }
        .s-item i { font-size: 20px; color: var(--neon); margin-bottom: 5px; display: block; }

        .tabs { position: sticky; top: 55px; background: var(--bg); display: flex; gap: 20px; padding: 10px 15px; border-bottom: 1px solid var(--border); overflow-x: auto; font-size: 13px; color: var(--text-gray); }
        .tab-active { color: #fff; border-bottom: 2px solid var(--neon); padding-bottom: 5px; font-weight: bold; }

        .coin-list { padding: 0 15px; }
        .coin-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.02); align-items: center; }
        .c-badge { background: var(--up); color: #000; padding: 6px 10px; border-radius: 4px; font-weight: bold; min-width: 65px; text-align: center; }
        .c-badge.down { background: var(--down); color: #fff; }

        .nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--bg); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); }
        .nav-link { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--text-gray); text-decoration: none; }
        .nav-active { color: var(--neon); }
    </style>
</head>
<body>
    <div class="top-header"><i class="fas fa-user-circle" style="font-size:22px;"></i><div class="search-bar">BTC/USDT</div><i class="fas fa-bell"></i></div>
    
    <div class="tickers-grid">
        <div class="t-card"><span>BTC/USDT</span><div class="t-price" style="color:var(--up)">64,520</div><small style="color:var(--up)">+2.1%</small></div>
        <div class="t-card"><span>ETH/USDT</span><div class="t-price" style="color:var(--down)">3,450</div><small style="color:var(--down)">-1.5%</small></div>
        <div class="t-card"><span>SOL/USDT</span><div class="t-price" style="color:var(--up)">145.2</div><small style="color:var(--up)">+5.4%</small></div>
    </div>

    <div class="services">
        <div class="s-item"><i class="fas fa-university"></i>إيداع</div>
        <div class="s-item"><i class="fas fa-robot"></i>البوت</div>
        <div class="s-item"><i class="fas fa-satellite-dish"></i>الرادار</div>
        <div class="s-item"><i class="fas fa-th-large"></i>المزيد</div>
    </div>

    <div class="tabs"><span class="tab-active">المفضلة</span><span>الرابحون</span><span>الخاسرون</span><span>حجم 24س</span></div>

    <div class="coin-list">
        <div class="coin-item"><div><i class="fas fa-star" style="color:#f0b90b; margin-left:8px;"></i><b>BTC</b><br><small style="color:var(--text-gray)">Vol 45B</small></div><div style="text-align:left"><b>64,520.10</b><br><small>$64,520</small></div><div class="c-badge">+2.15%</div></div>
        <div class="coin-item"><div><i class="fas fa-star" style="color:var(--text-gray); margin-left:8px;"></i><b>ETH</b><br><small style="color:var(--text-gray)">Vol 18B</small></div><div style="text-align:left"><b>3,450.05</b><br><small>$3,450</small></div><div class="c-badge down">-1.10%</div></div>
    </div>

    <nav class="nav">
        <a href="index.html" class="nav-link nav-active"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="markets.html" class="nav-link"><i class="fas fa-chart-line"></i>الأسواق</a>
        <a href="trade.html" class="nav-link"><i class="fas fa-exchange-alt"></i>تداول</a>
        <a href="futures.html" class="nav-link"><i class="fas fa-bolt"></i>العقود</a>
        <a href="wallet.html" class="nav-link"><i class="fas fa-wallet"></i>المحفظة</a>
    </nav>
</body>
</html>
