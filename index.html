<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind AI | Standard V4</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e11;
            --bg-panel: #181a20;
            --accent: #fcd535; /* اللون الذهبي القياسي */
            --border: #2b3139;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --green: #0ecb81;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-main); color: var(--text-primary); height: 100vh; overflow: hidden; }

        /* 1. الكابينة العلوية (Fixed Header) */
        .main-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }
        .header-icons { display: flex; gap: 18px; color: var(--text-secondary); cursor: pointer; }
        .logo-text { font-weight: bold; font-size: 18px; }
        .logo-text span { color: var(--accent); }

        /* 2. منطقة المحرك (Engine Mount) - مساحة الشارت والعملات */
        .engine-viewport {
            height: calc(100vh - 125px); /* خصم الهيدر والبار السفلي */
            overflow-y: auto;
            padding: 15px;
        }

        /* كرت الرصيد الموحد الهجين */
        .balance-card {
            background-color: var(--bg-panel);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            border: 1px solid var(--border);
        }
        .balance-label { color: var(--text-secondary); font-size: 13px; margin-bottom: 8px; }
        .balance-amount { font-size: 32px; font-weight: bold; letter-spacing: 1px; }

        /* قائمة الأسواق (المقاسات العالمية) */
        .market-section { margin-top: 10px; }
        .section-title { font-size: 16px; margin-bottom: 15px; font-weight: bold; }
        
        .coin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .coin-info { text-align: right; }
        .coin-symbol { font-weight: bold; font-size: 15px; }
        .coin-price { font-weight: bold; color: var(--green); font-size: 15px; }

        /* 3. شريط التحكم العالمي (5 Buttons) */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 65px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-secondary); cursor: pointer; text-decoration: none;
            flex: 1; transition: 0.2s;
        }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; }
        .nav-item.active { color: var(--text-primary); } /* الزر المختار */
        
        /* القائمة الجانبية (المزيد) */
        .side-menu {
            position: fixed; top: 0; right: -100%; width: 85%; height: 100%;
            background: var(--bg-main); z-index: 2000; transition: 0.3s;
            padding: 20px; border-left: 1px solid var(--border);
        }
        .side-menu.open { right: 0; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-icons">
            <i class="fas fa-bell"></i>
            <i class="fas fa-globe"></i>
        </div>
        <div class="logo-text">WhaleMind <span>AI</span></div>
        <div class="header-icons" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <main class="engine-viewport">
        <div class="balance-card">
            <div class="balance-label">الرصيد الموحد</div>
            <div class="balance-amount">$0.00</div>
        </div>

        <div class="market-section">
            <div class="section-title">أعلى العملات</div>
            
            <div class="coin-row">
                <div class="coin-info"><span class="coin-symbol">BTC/USDT</span></div>
                <div class="coin-price">$77,366.28</div>
            </div>

            <div class="coin-row">
                <div class="coin-info"><span class="coin-symbol">ETH/USDT</span></div>
                <div class="coin-price">$3,850.12</div>
            </div>

            <div class="coin-row">
                <div class="coin-info"><span class="coin-symbol">SOL/USDT</span></div>
                <div class="coin-price">$145.45</div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-home"></i><span>الرئيسية</span></div>
        <div class="nav-item"><i class="fas fa-chart-line"></i><span>الأسواق</span></div>
        <div class="nav-item"><i class="fas fa-exchange-alt"></i><span>تداول</span></div>
        <div class="nav-item"><i class="fas fa-bolt"></i><span>العقود</span></div>
        <div class="nav-item" onclick="toggleMenu()"><i class="fas fa-wallet"></i><span>المحفظة</span></div>
    </nav>

    <div id="sideMenu" class="side-menu">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h3 style="color:var(--accent)">الخدمات الهجينة</h3>
            <i class="fas fa-times" onclick="toggleMenu()" style="font-size:22px; cursor:pointer;"></i>
        </div>
        <div style="color:var(--text-secondary); font-size:14px;">جاهز لتركيب أنظمة الربط والاشتراكات...</div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
        }
    </script>
</body>
</html>
