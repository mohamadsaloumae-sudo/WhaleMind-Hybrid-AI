<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind AI | Global Terminal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div id="app">
        <header class="main-header">
            <div class="logo">WhaleMind <span>AI</span></div>
            <div class="status-indicator"><i class="fas fa-shield-alt"></i> نظام هجين آمن</div>
        </header>

        <main id="content-area" class="viewport">
            </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="router.load('home')">
                <i class="fas fa-home"></i><span>الرئيسية</span>
            </div>
            <div class="nav-item" onclick="router.load('markets')">
                <i class="fas fa-chart-line"></i><span>الأسواق</span>
            </div>
            <div class="nav-item" onclick="router.load('trade')">
                <i class="fas fa-exchange-alt"></i><span>تداول</span>
            </div>
            <div class="nav-item" onclick="router.load('futures')">
                <i class="fas fa-bolt"></i><span>العقود</span>
            </div>
            <div class="nav-item" onclick="router.load('wallets')">
                <i class="fas fa-wallet"></i><span>المحفظة</span>
            </div>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
