<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind AI Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e11;
            --surface: #1e2329;
            --neon: #00e5ff;
            --text-gray: #848e9c;
            --border: #2b3139;
            --up: #0ecb81;
            --down: #f6465d;
        }

        body { background: var(--bg); color: #fff; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; overflow: hidden; }

        /* 1. الطبقة السفلية: أزرار التنقل (Bottom Navigation) */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 65px;
            background: var(--bg); border-top: 1px solid var(--border);
            display: grid; grid-template-columns: repeat(5, 1fr);
            z-index: 1000;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 11px; color: var(--text-gray);
            cursor: pointer; transition: 0.3s;
        }

        .nav-item.active { color: var(--neon); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }

        /* 2. حاوي الصفحات (Pages Container) */
        .page { display: none; height: calc(100vh - 65px); overflow-y: auto; padding: 15px; }
        .page.active { display: block; }

        /* 3. الطبقة العميقة: نافذة منبثقة (Drawer Layer) */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; z-index: 2000;
        }
        .drawer {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: var(--surface); border-radius: 20px 20px 0 0;
            padding: 20px; transition: 0.4s ease; z-index: 2001;
        }
        .drawer.open { bottom: 0; }

        /* ستايل الكروت والمربعات (نفس الصور) */
        .crypto-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid var(--border);
        }

        /* الطبقة العميقة لزر التداول الآلي */
        .ai-bridge-btn {
            background: linear-gradient(90deg, #002d33, #00e5ff);
            color: #000; font-weight: 900; border: none; padding: 12px;
            width: 100%; border-radius: 8px; margin-top: 20px; cursor: pointer;
        }

    </style>
</head>
<body>

    <div id="home" class="page active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="color:var(--neon); font-weight:900; font-size:22px;">WHALEMIND</div>
            <i class="fas fa-search" style="font-size:18px;"></i>
        </div>
        
        <div style="display:flex; gap:10px; margin-top:25px;">
            <div onclick="openDrawer('deposit')" style="flex:1; background:var(--surface); padding:15px; border-radius:8px; text-align:center;">
                <i class="fas fa-download" style="color:var(--neon)"></i><br><small>إيداع</small>
            </div>
            <div onclick="openDrawer('ai-settings')" style="flex:1; background:var(--surface); padding:15px; border-radius:8px; text-align:center;">
                <i class="fas fa-robot" style="color:var(--neon)"></i><br><small>الروبوت</small>
            </div>
        </div>

        <h3>العملات الرائجة</h3>
        <div class="crypto-card">
            <div><b>BTC</b> <small style="color:var(--text-gray)">/USDT</small></div>
            <div style="text-align:left;"><div>64,120.5</div><small style="color:var(--up)">+1.2%</small></div>
        </div>
    </div>

    <div id="markets" class="page"><h3>الأسواق اللحظية</h3></div>
    <div id="trade" class="page"><h3>التداول الفوري</h3></div>
    <div id="futures" class="page"><h3>العقود الآجلة (Futures)</h3></div>
    <div id="wallet" class="page"><h3>المحفظة الشخصية</h3></div>

    <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
        <div style="width:50px; height:5px; background:#333; border-radius:10px; margin:0 auto 15px;"></div>
        <h4 id="drawer-title">إعدادات الطبقة العميقة</h4>
        <div id="drawer-content">
            <label>اختر الرافعة المالية</label>
            <input type="range" style="width:100%; accent-color:var(--neon);">
            <button class="ai-bridge-btn">تأكيد الإعدادات</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showPage('home', this)"><i class="fas fa-home"></i><span>الرئيسية</span></div>
        <div class="nav-item" onclick="showPage('markets', this)"><i class="fas fa-chart-line"></i><span>الأسواق</span></div>
        <div class="nav-item" onclick="showPage('trade', this)"><i class="fas fa-exchange-alt"></i><span>تداول</span></div>
        <div class="nav-item" onclick="showPage('futures', this)"><i class="fas fa-bolt"></i><span>العقود</span></div>
        <div class="nav-item" onclick="showPage('wallet', this)"><i class="fas fa-wallet"></i><span>المحفظة</span></div>
    </div>

    <script>
        // التبديل بين الصفحات الخمس
        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            element.classList.add('active');
        }

        // التحكم في الطبقات العميقة (Drawer)
        function openDrawer(type) {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            if(type === 'ai-settings') {
                document.getElementById('drawer-title').innerText = "إعدادات روبوت تيتانيوم 60";
            }
            drawer.classList.add('open');
            overlay.style.display = 'block';
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
