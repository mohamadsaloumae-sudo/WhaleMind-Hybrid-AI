<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhaleMind AI | Pro Trading Terminal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* الألوان الأصلية لباينانس بدقة 100% */
        :root {
            --bg: #0b0e11; --surface: #1e2329; --input: #2b3139; --text-primary: #eaecef; 
            --text-gray: #848e9c; --neon: #f0b90b; --up: #0ecb81; --down: #f6465d; 
            --border: #2b3139;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--text-primary); overflow: hidden; height: 100vh; }

        /* الهيدر العلوي المتطور */
        .trade-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .pair-selector { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .pair-name { font-size: 20px; font-weight: 900; }
        .pair-change { font-size: 12px; font-weight: bold; color: var(--up); }

        /* شريط الفريمات المتعددة (البنية التحتية للتحكم بالوقت) */
        .timeframes-bar { display: flex; gap: 15px; padding: 8px 15px; border-bottom: 1px solid var(--border); background: #161a1e; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .tf-item { color: var(--text-gray); font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .tf-item.active { color: var(--neon); }
        .tf-item:hover { color: #fff; }

        /* الحاوية الرئيسية للرسم البياني */
        #pro-chart-area { width: 100%; height: 45vh; background: #000; border-bottom: 4px solid #181a20; }

        /* منطقة التداول والسجلات */
        .trading-split { display: grid; grid-template-columns: 1.3fr 1fr; height: calc(55vh - 70px); }

        /* سجل الأوامر المباشر (Order Book Depth) */
        .order-book-panel { padding: 10px; font-size: 11px; border-left: 1px solid var(--border); overflow-y: auto; }
        .ob-header { display: flex; justify-content: space-between; color: var(--text-gray); padding-bottom: 5px; font-weight: bold; }
        .ob-row { display: flex; justify-content: space-between; margin: 1px 0; position: relative; height: 18px; align-items: center; }
        
        /* تأثير العمق (Visual Depth Effect) */
        .depth-bg-red { position: absolute; right: 0; height: 100%; background: rgba(246, 70, 93, 0.15); z-index: 0; }
        .depth-bg-green { position: absolute; right: 0; height: 100%; background: rgba(14, 203, 129, 0.15); z-index: 0; }
        .ob-row span { z-index: 1; position: relative; }

        /* لوحة الأوامر (Buy/Sell) */
        .action-panel { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .trade-toggle { display: flex; background: var(--surface); border-radius: 4px; padding: 2px; margin-bottom: 5px; }
        .t-btn { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 900; border-radius: 4px; cursor: pointer; }
        .buy-btn { background: var(--up); color: #000; }
        .sell-btn { color: var(--text-gray); }

        .price-input-grp { background: var(--input); border-radius: 4px; padding: 12px; display: flex; justify-content: space-between; border: 1px solid transparent; }
        .price-input-grp:focus-within { border-color: var(--neon); }
        .price-input-grp input { background: transparent; border: none; color: #fff; width: 70%; outline: none; font-size: 14px; font-weight: bold; }
        .price-input-grp label { font-size: 12px; color: var(--text-gray); }

        .submit-btn { background: var(--up); color: #000; border: none; padding: 15px; border-radius: 4px; font-weight: 900; font-size: 16px; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(14, 203, 129, 0.2); }

        /* الملاحة السفلية */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--bg); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 4000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--text-gray); text-decoration: none; }
        .nav-item.active { color: var(--neon); }
    </style>
</head>
<body>

    <div class="trade-header">
        <div class="pair-selector">
            <i class="fas fa-exchange-alt" style="color:var(--neon)"></i>
            <span class="pair-name">BTC / USDT</span>
            <span class="pair-change">+2.45%</span>
        </div>
        <div style="display:flex; gap:20px; color:var(--text-gray)">
            <i class="fas fa-chart-bar"></i>
            <i class="fas fa-cog"></i>
        </div>
    </div>

    <div class="timeframes-bar">
        <div class="tf-item">الزمن</div>
        <div class="tf-item active">15m</div>
        <div class="tf-item">1h</div>
        <div class="tf-item">4h</div>
        <div class="tf-item">1d</div>
        <div class="tf-item">أسبوع</div>
        <div class="tf-item"><i class="fas fa-caret-down"></i></div>
    </div>

    <div id="pro-chart-area"></div>

    <div class="trading-split">
        <div class="action-panel">
            <div class="trade-toggle"><div class="t-btn buy-btn">شراء</div><div class="t-btn sell-btn">بيع</div></div>
            <div class="price-input-grp"><label>السعر</label><input type="text" value="64520.10"><span>USDT</span></div>
            <div class="price-input-grp"><label>الكمية</label><input type="text" placeholder="0.0001"><span>BTC</span></div>
            <button class="submit-btn">شراء BTC</button>
        </div>

        <div class="order-book-panel">
            <div class="ob-header"><span>السعر</span><span>المبلغ</span></div>
            <div class="ob-row sell-side" style="color:var(--down)"><div class="depth-bg-red" style="width: 40%;"></div><span>64535.1</span><span>0.124</span></div>
            <div class="ob-row sell-side" style="color:var(--down)"><div class="depth-bg-red" style="width: 70%;"></div><span>64532.4</span><span>1.502</span></div>
            <div style="text-align:center; padding:12px 0; font-size:18px; font-weight:900; color:var(--up);">64520.10 <i class="fas fa-arrow-up" style="font-size:12px;"></i></div>
            <div class="ob-row buy-side" style="color:var(--up)"><div class="depth-bg-green" style="width: 55%;"></div><span>64518.5</span><span>2.110</span></div>
            <div class="ob-row buy-side" style="color:var(--up)"><div class="depth-bg-green" style="width: 30%;"></div><span>64515.2</span><span>0.852</span></div>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="markets.html" class="nav-item"><i class="fas fa-chart-line"></i><span>الأسواق</span></a>
        <a href="pro_trade.html" class="nav-item active"><i class="fas fa-exchange-alt"></i><span>تداول</span></a>
        <a href="futures.html" class="nav-item"><i class="fas fa-bolt"></i><span>العقود</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>المحفظة</span></a>
    </nav>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        new TradingView.widget({
            "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "15", "timezone": "Etc/UTC",
            "theme": "dark", "style": "1", "locale": "ar", "container_id": "pro-chart-area",
            "hide_top_toolbar": true, "withdateranges": true, "hide_side_toolbar": false, "allow_symbol_change": true
        });
    </script>
</body>
</html>
